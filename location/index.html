<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A-Frame - Location Based AR</title>
    <!-- Bibliotecas A-Frame e AR.js para geolocalizacao -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Camara do utilizador associada ao GPS do telemovel -->
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- ENTIDADE 1: Caixa 3D vermelha numa coordenada GPS -->
      <!-- Substitui a latitude e longitude pelas tuas coordenadas reais -->
      <a-box
        material="color: red;"
        scale="2 2 2"
        gps-entity-place="latitude: 41.14961; longitude: -8.61099;"
        look-at="[gps-camera]"
      >
      </a-box>

      <!-- ENTIDADE 2: Texto 3D verde noutra coordenada GPS -->
      <a-text
        value="Objeto RA Aqui!"
        scale="5 5 5"
        align="center"
        color="#00FF00"
        gps-entity-place="latitude: 41.14970; longitude: -8.61080;"
        look-at="[gps-camera]"
      ></a-text>
    </a-scene>
  </body>
</html>
