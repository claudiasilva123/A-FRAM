<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Tracking - MindAR</title>
    <!-- Bibliotecas A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- Define a fonte do ficheiro .mind para detetar a imagem -->
    <a-scene
      mindar-image="imageTargetSrc: https://acspt.github.io/A-FRAME/ar/image/detect-spinosaurus-mindar/assets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Modelo 3D do dinossauro -->
        <a-asset-item 
          id="spinosaurusModel" 
          src="https://acspt.github.io/A-FRAME/ar/image/detect-spinosaurus-mindar/assets/spinosaurus/scene.gltf">
        </a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Ativado quando a imagem e detetada pela camara -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Objeto 3D posicionado sobre a imagem -->
        <a-gltf-model
          src="#spinosaurusModel"
          position="0 0 0"
          scale="0.05 0.05 0.05"
          rotation="0 0 0"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
