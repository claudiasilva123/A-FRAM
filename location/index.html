<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Teste AR.js - Location Based</title>

    <!-- Versões estáveis e compatíveis do A-Frame e AR.js -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- 
        SUGESTÃO: Substitua a latitude e longitude abaixo pelas coordenadas 
        de onde se encontra exatamente neste momento!
      -->
      <a-box
        material="color: #FF0000; opacity: 0.8;"
        scale="15 15 15"
        position="0 0 0"
        gps-entity-place="latitude: 41.477888; longitude: -7.177453;"
      >
      </a-box>

      <a-text
        value="OBJETO ENCONTRADO!"
        scale="20 20 20"
        color="#FFFF00"
        align="center"
        position="0 10 0"
        look-at="[gps-camera]"
        gps-entity-place="latitude: 41.4850; longitude: -7.1810;"
      >
      </a-text>

      <!-- Câmera com leitor de GPS -->
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>
  </body>
</html>
