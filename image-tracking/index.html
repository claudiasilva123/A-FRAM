<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A-Frame MindAR Image Tracking</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR para A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- Define o ficheiro .mind compilado e o índice do alvo a detetar -->
    <a-scene
      mindar-image="imageTargetSrc: https://acspt.github.io/A-FRAME/ar/image/detect-spinosaurus-mindar/assets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Modelo 3D ou imagem a ser projetada -->
        <a-asset-item id="spinosaurusModel" src="https://acspt.github.io/A-FRAME/ar/image/detect-spinosaurus-mindar/assets/spinosaurus.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Anchor 0: Associada ao 1º target do ficheiro targets.mind -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Entidade 3D anexada ao alvo -->
        <a-gltf-model
          src="#spinosaurusModel"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.05 0.05 0.05"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
