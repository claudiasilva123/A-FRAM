<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Location Based AR</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js para Location-Based AR -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Atributos ajustáveis: gps-entity-place (latitude e longitude), scale, position e color -->
      
      <!-- Exemplo 1: Caixas 3D posicionadas no espaço GPS -->
      <a-box
        material="color: #4CC3D9;"
        scale="2 2 2"
        position="0 0.5 0"
        gps-entity-place="latitude: 41.4881; longitude: -7.1818;"
      ></a-box>

      <!-- Exemplo 2: Texto 3D virado para a câmara do utilizador -->
      <a-text
        value="Objeto GPS A-Frame"
        scale="3 3 3"
        color="red"
        align="center"
        look-at="[gps-camera]"
        gps-entity-place="latitude: 41.4881; longitude: -7.1818;"
      ></a-text>

      <!-- Câmara com GPS -->
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>
  </body>
</html>
